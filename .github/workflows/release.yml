name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "v$version" -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)" = "true" ]; then
              echo "Release v$version is incomplete, building it again."
              gh release delete "v$version" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
              git tag -d "v$version" || true
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release v$version already exists."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Test
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE) { exit 1 }
          cd src-tauri
          cargo test --lib
          if ($LASTEXITCODE) { exit 1 }
      - name: Build crest-notify
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo build --release --bin crest-notify --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit 1 }
      - name: Build Installer and App
        shell: pwsh
        run: |
          npx tauri build --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit 1 }
      - name: Package Portable and Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ needs.check.outputs.version }}"
          $tag = "v$ver"
          $zip = "Crest-$ver-Portable-x64.zip"
          ./scripts/portable-package.ps1 -Exe "src-tauri/target/x86_64-pc-windows-msvc/release/crest.exe" -Destination $zip

          $setup = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Crest_${ver}_x64-setup.exe"
          if (-not (Test-Path $setup)) {
            $found = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*setup.exe" | Select-Object -First 1
            if ($found) { $setup = $found.FullName }
          }

          Get-FileHash -Algorithm SHA256 $setup, $zip | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content SHA256SUMS

          $notes = @"
          ### Crest v$ver (Custom Fork for Windows)

          > **Personal Project / AI-Assisted Fork by [@xenon537](https://github.com/xenon537)**
          > Built with Google Antigravity.

          #### Features in this fork (based on Crest v$ver):
          1. **Focus Mode (3-Click / 3-Tap):**
             - Triple-click the notch capsule or header to enter Focus Mode (dims and enables click-through passthrough so mouse clicks go to background apps).
             - Triple-click the notch area or toggle in tray/settings to exit.
             - Enabled by default in this fork.
          2. **Live Network Speed in Capsule:**
             - Download and upload bandwidth speeds visible directly on the closed capsule out of the box.
          3. **Now Playing Direct Closed Lyrics Toggle:**
             - Direct 1-click button on the Now Playing player toolbar and header to toggle closed-window lyrics on/off without opening Settings.

          #### Downloads:
          - **Installer (recommended):** [Crest_${ver}_x64-setup.exe](https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Crest_${ver}_x64-setup.exe)
          - **Portable:** [Crest-$ver-Portable-x64.zip](https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$zip)

          *If Windows SmartScreen warns "Windows protected your PC", click **More info -> Run anyway**.*
          "@

          if (gh release view $tag -R $env:GITHUB_REPOSITORY >$null 2>&1) {
            gh release upload $tag $setup $zip SHA256SUMS -R $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag -R $env:GITHUB_REPOSITORY --notes $notes --prerelease=false --latest
          } else {
            gh release create $tag $setup $zip SHA256SUMS -R $env:GITHUB_REPOSITORY --title "Crest v$ver (Custom Fork)" --notes $notes --latest
          }
